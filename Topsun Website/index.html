    <!-- Instant loading splash screen styles (before React mounts) -->
    <style>
      #ts-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0c0c0c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #ts-splash.hide {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      #ts-splash .glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 340px;
        height: 340px;
        background: radial-gradient(circle, rgba(0,159,227,0.15) 0%, transparent 70%);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        animation: pulse-glow 2.5s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
      }
      #ts-splash .logo-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        animation: fade-in-up 0.55s ease forwards;
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #ts-splash .logo-text {
        font-size: clamp(2.8rem, 8vw, 4.2rem);
        font-weight: 900;
        letter-spacing: 0.28em;
        color: #ffffff;
        text-shadow: 0 0 28px rgba(0,159,227,0.5);
        line-height: 1;
      }
      #ts-splash .tagline-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        margin-bottom: 28px;
      }
      #ts-splash .tagline-line {
        height: 1px;
        width: 30px;
        background: linear-gradient(to right, transparent, #009FE3);
      }
      #ts-splash .tagline-line.right {
        background: linear-gradient(to left, transparent, #009FE3);
      }
      #ts-splash .tagline {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #009FE3;
      }
      #ts-splash .progress-wrap {
        position: relative;
        z-index: 1;
        width: 180px;
        height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 99px;
        overflow: hidden;
      }
      #ts-splash .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #009FE3, #38bdf8, #009FE3);
        border-radius: 99px;
        box-shadow: 0 0 12px #009FE3;
        animation: fill-bar 1.1s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      }
      @keyframes fill-bar {
        0% { width: 0%; }
        70% { width: 85%; }
        100% { width: 100%; }
      }
      #ts-splash .status {
        position: relative;
        z-index: 1;
        margin-top: 12px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.35);
        animation: fade-in-up 0.55s 0.25s ease both;
      }
    </style>

      />
    </noscript>
    <!-- End Meta Pixel Noscript -->

    <!-- TOPSUN Branded Splash Screen (shown instantly before React loads) -->
    <div id="ts-splash">
      <div class="glow"></div>
      <div class="logo-wrap">
        <div class="logo-text">TOPSUN</div>
        <div class="tagline-row">
          <span class="tagline-line"></span>
          <span class="tagline">Performance Footwear</span>
          <span class="tagline-line right"></span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"></div>
        </div>
        <div class="status">Engineering Comfort...</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Auto-hide splash once React has mounted -->
    <script>
      (function() {
        function hideSplash() {
          var splash = document.getElementById('ts-splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(function() {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 500);
          }
        }
        // Watch for root to have children (React mounted)
        var observer = new MutationObserver(function(mutations) {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            setTimeout(hideSplash, 200);
          }
        });
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            observer.observe(root, { childList: true });
          }
        });
        // Hard fallback: hide after 4 seconds no matter what
        setTimeout(hideSplash, 4000);
      })();
    </script>
  </body>
