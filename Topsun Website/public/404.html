<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | TOPSUN Footwear</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #faf7f2;
      color: #121518;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4ded5;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(18, 21, 24, 0.05);
    }
    .code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 5rem;
      font-weight: 700;
      color: #b38b3f;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: #121518;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.875rem;
      color: #606870;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: #121518;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover { background-color: #000000; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been moved, deleted, or never existed in the TOPSUN collection.</p>
    <a href="/" class="btn">Return to Store</a>
  </div>
</body>
</html>
